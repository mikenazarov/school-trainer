<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nederlands · basis</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--mute:#69707a;--line:#e3e0d8;--or:#e8590c;--or2:#fff1e6;--bl:#21468b;--bl2:#e8eefb;--ok:#2b8a3e;--ok2:#e6f6ea;--bad:#c92a2a;--bad2:#fdecec;--chip:#efece4}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1f2228;--ink:#e9eaec;--mute:#9aa1ab;--line:#30343c;--or:#ff8a3d;--or2:#3a2a1e;--bl:#8fb0ff;--bl2:#1f2a44;--ok:#69db7c;--ok2:#1d3324;--bad:#ff8787;--bad2:#3a2022;--chip:#2a2e35}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.05rem;margin:26px 0 10px}
.sub{color:var(--mute);font-size:.92rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-align:center;min-width:72px}
.stat b{display:block;font-size:1.2rem}.stat span{font-size:.75rem;color:var(--mute)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.unit{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.unit.on{border-color:var(--or);background:var(--or2)}
.unit .wk{font-size:.72rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.unit .nm{font-weight:700;margin:2px 0 1px;padding-right:34px}
.unit .ru{font-size:.85rem;color:var(--mute);padding-right:34px}
.unit .bar{height:6px;background:var(--chip);border-radius:4px;margin-top:8px;overflow:hidden}.unit .bar i{display:block;height:100%;background:var(--ok)}
.unit .lrn{position:absolute;top:8px;right:8px;border:0;background:var(--chip);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:1rem}
.hint{font-size:.85rem;color:var(--mute);margin:6px 0 0}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.game{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;gap:10px;align-items:flex-start}
.game:hover,.unit:hover{border-color:var(--or)}
.game .ic{font-size:1.5rem;line-height:1}.game b{display:block}.game small{color:var(--mute);font-size:.8rem;display:block}
.game.big{grid-column:1/-1;background:var(--bl2);border-color:transparent}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.btn{font:inherit;font-weight:600;border:0;border-radius:11px;padding:10px 16px;cursor:pointer;background:var(--or);color:#fff}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.prog{flex:1;height:8px;background:var(--chip);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--or);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px}
.ctx{font-size:.85rem;color:var(--mute);margin-bottom:6px}
.prompt{font-size:1.45rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prompt.ruP{font-weight:600}
.say{border:0;background:var(--bl2);color:var(--bl);border-radius:50%;width:42px;height:42px;font-size:1.15rem;cursor:pointer;flex:none}
.say.huge{width:76px;height:76px;font-size:2rem}
.task{color:var(--mute);font-size:.9rem;margin-top:6px}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{font:inherit;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;color:inherit}
.opt:hover:not(:disabled){border-color:var(--bl)}
.opt .k{display:inline-block;width:20px;color:var(--mute);font-size:.8rem}
.opt.right{border-color:var(--ok);background:var(--ok2)}.opt.wrong{border-color:var(--bad);background:var(--bad2)}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
input.ans{flex:1;min-width:200px;font:inherit;font-size:1.15rem;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.ans:focus{outline:none;border-color:var(--bl)}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:.95rem}
.fb.ok{background:var(--ok2)}.fb.bad{background:var(--bad2)}
.fb b{font-size:1.02rem}
.tip{margin-top:6px;color:var(--mute)}
.keys{display:flex;gap:6px;margin-top:8px}.keys button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;cursor:pointer}
.cardv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 20px;text-align:center;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer}
.cardv .nl{font-size:1.7rem;font-weight:700}.cardv .tr{font-size:1.1rem}.cardv .tp{color:var(--mute);font-size:.9rem}
.note{background:var(--bl2);border-radius:12px;padding:10px 14px;font-size:.92rem;margin-bottom:14px}
.res{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 18px}
.res .big{font-size:2.6rem;font-weight:800}
.mist{text-align:left;margin:16px 0 0;padding:0;list-style:none}.mist li{border-top:1px solid var(--line);padding:8px 2px;font-size:.95rem}
.set{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--mute);margin-top:24px}
.set input{accent-color:var(--or)}
@media (max-width:480px){.prompt{font-size:1.25rem}h1{font-size:1.3rem}}
</style>
</head>

function selItems(){ const s=ALL.filter(x=>S.sel.includes(x.u)); return s.length?s:ALL.filter(x=>x.u==="groet"); }
function distract(ans,field,pool,n=3){
  const out=[], seen=new Set([ans[field]]);
  for(const src of [shuf(pool.filter(x=>x.u===ans.u)),shuf(pool),shuf(ALL)]) for(const x of src){ if(out.length>=n) break; if(!seen.has(x[field])){seen.add(x[field]);out.push(x[field]);} }
  return out;
}
function mkWord(type,it,pool){
  pool=pool||ALL;
  if(type==="words") return {type,key:"w:"+it.nl,ref:it.nl,label:`${it.nl} = ${it.ru}`,ctx:"Что это значит?",prompt:it.nl,nl:true,speak:it.nl,auto:true,opts:shuf([it.ru,...distract(it,"ru",pool)]),ans:it.ru,tip:it.tip};
  if(type==="hoeren") return {type,key:"h:"+it.nl,ref:it.nl,label:`🎧 ${it.nl} = ${it.ru}`,ctx:"Послушайте и выберите перевод",prompt:"",listen:true,speak:it.nl,auto:true,opts:shuf([it.ru,...distract(it,"ru",pool)]),ans:it.ru,reveal:it.nl,tip:it.tip};
  if(type==="reverse") return {type,key:"r:"+it.nl,ref:it.nl,label:`${it.ru} → ${it.nl}`,ctx:"Как это сказать по-нидерландски?",prompt:it.ru,opts:shuf([it.nl,...distract(it,"nl",pool)]),ans:it.nl,after:it.nl,tip:it.tip};
  if(type==="spell") return {type,key:"s:"+it.nl,ref:it.nl,label:`${it.ru} → ${it.nl}`,ctx:"Напишите по-нидерландски",prompt:it.ru,typed:true,ans:it.nl,after:it.nl,tip:it.tip};
}
function mkDialog(i){ const [u,who,cue,right,wrong]=DIALOG[i];
  return {type:"dialog",key:"d:"+i,ref:i,label:`«${cue}» → ${right}`,ctx:`${who} говорит:`,prompt:cue,nl:true,speak:cue,auto:true,task:"Что вы ответите?",opts:shuf([right,...wrong]),ans:right,after:right};
}
function priceText(e,c){ return `${numWord(e)} euro${c?" "+numWord(c):""}`; }
function mkNum(ref){ // ref: "h:47" hear number, "p:47" pick word, "e:4,50" hear price
  const [m,v]=ref.split(":");
  if(m==="h"){ const n=+v; return {type:"num",key:"n:"+ref,ref,label:`${numWord(n)} = ${n}`,ctx:"Послушайте и напишите число цифрами",listen:true,speak:numWord(n),auto:true,typed:true,digits:true,ans:String(n),reveal:numWord(n),tip:n>20&&n%10?"Сначала единицы, потом десятки.":""}; }
  if(m==="p"){ const n=+v, sw=n>20&&n%10?(n%10)*10+Math.floor(n/10):null, c=new Set([numWord(n)]);
    if(sw&&sw!==n&&sw<100) c.add(numWord(sw)); while(c.size<4){ const k=n>20?21+Math.floor(Math.random()*79):Math.floor(Math.random()*21); c.add(numWord(k)); }
    return {type:"num",key:"n:"+ref,ref,label:`${n} = ${numWord(n)}`,ctx:"Как пишется это число?",prompt:String(n),opts:shuf([...c]),ans:numWord(n),after:numWord(n),tip:sw?"Сначала единицы, потом десятки.":""}; }
  const [e,c]=v.split(",").map(Number); const txt=priceText(e,c);
  return {type:"num",key:"n:"+ref,ref,label:`${txt} = ${v} €`,ctx:"Сколько это стоит? Напишите цифрами (например 4,50)",listen:true,speak:txt,auto:true,typed:true,digits:true,price:true,ans:v,reveal:txt};
}
function randNum(){ const r=Math.random();
  if(r<.15){ const e=1+Math.floor(Math.random()*25), c=rnd([0,10,20,25,50,75,95]); return "e:"+e+","+(c?pad(c):"00"); }
  const n=r<.4?Math.floor(Math.random()*21):r<.5?10*(2+Math.floor(Math.random()*8)):21+Math.floor(Math.random()*79);
  return (Math.random()<.6?"h:":"p:")+n;
}
const HW=h=>NUMW[h]||["","","","","","","","","","","","elf","twaalf"][h];
const nxt=h=>h%12+1;
const TFORMS={uur:[h=>`${HW(h)} uur`,0,0],kwo:[h=>`kwart over ${HW(h)}`,0,15],half:[h=>`half ${HW(nxt(h))}`,0,30],kwv:[h=>`kwart voor ${HW(nxt(h))}`,0,45],tio:[h=>`tien over ${HW(h)}`,0,10],tiv:[h=>`tien voor ${HW(nxt(h))}`,0,50]};
const clock=(h,m)=>`${h}:${pad(m)}`;
function mkTime(ref){ const [h,f]=ref.split(":"), H=+h, F=TFORMS[f], txt=F[0](H), right=clock(H,F[2]);
  const c=new Set([right]); if(f==="half"||f==="kwv"||f==="tiv") c.add(clock(nxt(H),F[2]));
  if(f==="half") c.add(clock(nxt(H),0)); if(f==="kwo") c.add(clock(H,45)); if(f==="kwv") c.add(clock(H,15));
  while(c.size<4) c.add(clock(rnd([H,nxt(H)]),rnd([0,10,15,30,45,50])));
  const tip=f==="half"?`half ${HW(nxt(H))} = половина ${nxt(H)}-го = ${right}.`:f==="kwv"||f==="tiv"?`«voor» — «до»: без ${f==="kwv"?"четверти":"десяти"} ${nxt(H)}.`:"";
  return {type:"time",key:"t:"+ref,ref,label:`${txt} = ${right}`,ctx:"Который час?",prompt:`Het is ${txt}.`,nl:true,speak:`Het is ${txt}.`,auto:true,opts:shuf([right,...[...c].filter(x=>x!==right).slice(0,3)]),ans:right,tip};
}
function randTime(){ return (1+Math.floor(Math.random()*12))+":"+rnd(Object.keys(TFORMS)); }
function mkVerb(i){ const [s,a,ru,inf]=VERBS[i], inv=/^___|___ (je|jij)\b/.test(s);
  return {type:"verbs",key:"v:"+i,ref:i,label:`${s.replace("___",a.split("|")[0])}`,ctx:`${ru}`,prompt:s.replace("___","<u>&nbsp;?&nbsp;</u>"),html:true,task:`Вставьте форму глагола <b>${inf}</b>`,typed:true,ans:a,after:s.replace("___",a.split("|")[0]),tip:(inv&&/jij|je\b/.test(s)?INV_TIP+" ":"")+VERB_TIP[inf]};
}
function rebuild(I){ const r=I.ref;
  if(I.t==="dialog") return DIALOG[r]&&mkDialog(r); if(I.t==="verbs") return VERBS[r]&&mkVerb(r);
  if(I.t==="num") return mkNum(r); if(I.t==="time") return mkTime(r);
  const it=BYNL[r]; return it&&mkWord(I.t,it); }
function makeRound(g){
  const pool=selItems(), N=g==="mix"?15:10, out=[];
  const wordQ=t=>{ let p=pool; if(t==="spell") p=pool.filter(x=>x.nl.split(" ").length<=5); return mkWord(t,rnd(p),pool); };
  const dlg=()=>{ let ids=DIALOG.map((d,i)=>i).filter(i=>S.sel.includes(DIALOG[i][0])); if(ids.length<3) ids=DIALOG.map((d,i)=>i); return mkDialog(rnd(ids)); };
  if(g==="tricky"){ return Object.values(S.items).filter(x=>x.w>0&&x.w>x.r-1).sort((a,b)=>(b.w-b.r*.5)-(a.w-a.r*.5)).slice(0,N).map(rebuild).filter(Boolean); }
  const used=new Set();
  for(let k=0;k<N*4&&out.length<N;k++){
    let t=g; if(g==="mix"){ const opts=["words","reverse","hoeren","spell","dialog"]; if(S.sel.includes("getal")) opts.push("num","num"); if(S.sel.includes("prijs")) opts.push("time"); if(S.sel.includes("werkw")) opts.push("verbs","verbs"); t=rnd(opts); }
    const q=t==="dialog"?dlg():t==="num"?mkNum(randNum()):t==="time"?mkTime(randTime()):t==="verbs"?mkVerb(Math.floor(Math.random()*VERBS.length)):wordQ(t);
    if(q&&!used.has(q.key)){ used.add(q.key); out.push(q); }
  }
  return out;
}

const norm=s=>s.toLowerCase().replace(/[.,!?¿¡"«»“”:;]/g," ").replace(/[’`]/g,"'").replace(/\s+/g," ").trim();
const flat=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function check(inp,q){
  if(q.digits){ const v=inp.replace(/[€\s]/g,"").replace(".",","); const a=q.ans; if(q.price){ const [e,c]=v.split(","); const [ae,ac]=a.split(","); return +e===+ae&&+(c||0)===+ac?"ok":"bad"; } return v===a?"ok":"bad"; }
  const answers=q.ans.split("|"), n=norm(inp);
  if(answers.some(a=>norm(a)===n)) return "ok";
  if(answers.some(a=>flat(norm(a))===flat(n))) return "accent";
  return "bad";
}

    <div class="row"><button class="btn" id="nx">${R.i<R.qs.length-1?"Дальше →":"Итог"}</button>${q.speak?`<button class="btn sec" id="sp2">🔊</button>`:""}</div>`;
  if($("#inp")){ $("#inp").disabled=true; $("#go").disabled=true; $("#idk").disabled=true; }
  $("#nx").onclick=next; if($("#sp2")) $("#sp2").onclick=()=>say(q.after||q.speak); $("#nx").focus();
}
function next(){ R.i++; if(R.i>=R.qs.length) finish(); else draw(); }
function finish(){
  const n=R.i+(R.done&&R.i<R.qs.length?1:0); if(!n) return home();
  const p=Math.round(R.ok/n*100); S.rounds++; if(n>=5) S.best[R.g]=Math.max(S.best[R.g]||0,p); save();
  app.innerHTML=`<div class="res"><div class="big">${R.ok} / ${n}</div><p>${p>=90?"Uitstekend! 🎉":p>=70?"Goed gedaan! 👍":"Oefening baart kunst — повторение мать учения 💪"}</p>
    ${R.mist.length?`<ul class="mist">${R.mist.map(q=>`<li>${esc(q.label)}</li>`).join("")}</ul><p class="hint">Эти вопросы попадут в «Мои ошибки».</p>`:""}
    <div class="row" style="justify-content:center"><button class="btn" id="again">Ещё раунд</button><button class="btn sec" id="hm">На главную</button></div></div>`;
  $("#again").onclick=()=>start(R.g); $("#hm").onclick=home; R.done=true; R.i=R.qs.length;
}
document.addEventListener("keydown",e=>{
  if(!R||!$(".q")) return;
  if(e.key==="Enter"){ if(R.done&&$("#nx")){ e.preventDefault(); $("#nx").click(); } else if($("#go")&&document.activeElement===$("#inp")){ e.preventDefault(); $("#go").click(); } return; }
  if(!R.done&&!$("#inp")&&/^[0-4]$/.test(e.key)){ const b=app.querySelectorAll("[data-o]")[e.key==="0"?app.querySelectorAll("[data-o]").length-1:+e.key-1]; b&&b.click(); }
});
home();
</script>
</body>
</html>
