<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filipp's French Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1b2f; --muted:#5b5872; --card:#ffffff; --line:#1b1b2f;
  --der:#2f7bff; --das:#14b86a; --die:#ff3d5a; --ok:#14b86a; --bad:#ff3d5a; --accent:#ff7a1a;
  --sh:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;font-weight:700}
body{min-height:100vh;background:#e6f3fb radial-gradient(circle at 1px 1px,rgba(27,27,47,.07) 1.5px,transparent 0) 0 0/22px 22px;}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(170deg,#f2f9fd 0%,#e3f1fa 55%,#d6eaf6 100%)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.wrap{max-width:740px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.flag{width:40px;height:30px;border-radius:7px;overflow:hidden;display:flex;flex-direction:column;flex:none;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(-6deg)}
.flag{flex-direction:row!important}.flag i{flex:1}.flag i:nth-child(1){background:#0055a4}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#ef4135}
h1{font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.9rem;line-height:1;margin:0;letter-spacing:.5px;text-shadow:3px 3px 0 #fff}
h1 small{display:block;font-family:Nunito;font-size:.85rem;color:var(--ink);font-weight:800;text-shadow:none;margin-top:4px;opacity:.75}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 11px;font-weight:900;white-space:nowrap;font-size:.95rem;box-shadow:3px 3px 0 var(--ink)}
button.pill:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
h2{font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.45rem;margin:24px 0 10px;letter-spacing:.5px;color:var(--ink);text-shadow:3px 3px 0 #fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{border:3px solid var(--ink);border-radius:20px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;box-shadow:var(--sh);transition:transform .12s}
.tile:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:6px 6px 0 var(--ink)}
.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tile .ic{font-size:1.9rem;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;background:#fff!important;border:3px solid var(--ink)}
.tile b{display:block;color:var(--ink);font-size:1.08rem;font-weight:900}
.tile>span>span{display:block;font-size:.84rem;color:var(--ink);opacity:.75;font-weight:800}
.tile .best{color:var(--ink);opacity:1!important;letter-spacing:2px;font-size:1rem!important}
.tile.big{padding:18px}
.tile.big b{font-family:"Lilita One";font-weight:400;font-size:1.45rem;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:6px 13px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
.chip.on{background:var(--ink);color:#ffe066}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:3px solid var(--ink);border-radius:16px;padding:12px 20px;font-weight:900;background:var(--accent);color:#fff;box-shadow:var(--sh);font-size:1.05rem;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none}
.btn:disabled{opacity:.45}
/* mascot */
.hero{display:flex;align-items:flex-end;gap:10px;margin:6px 0 4px}
.mascot{width:92px;height:92px;flex:none;animation:bob 2.4s ease-in-out infinite;cursor:pointer;filter:drop-shadow(3px 3px 0 var(--ink))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:900;box-shadow:var(--sh);margin-bottom:22px;font-size:1.02rem}
.bubble::before{content:"";position:absolute;left:-14px;bottom:12px;border:8px solid transparent;border-right:12px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-8px;bottom:14px;border:6px solid transparent;border-right:9px solid #fff}
.lvl{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:var(--sh);margin-top:6px}
.lvl b{font-family:"Lilita One";font-weight:400;font-size:1.15rem;white-space:nowrap}
.lvl .bar{height:20px}
.lvl .bar,.lvl .bar i{background-size:20px 20px}
/* game */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.x{border:3px solid var(--ink);background:#fff;font-size:1.1rem;font-weight:900;color:var(--ink);padding:4px 11px;border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.bar{flex:1;height:24px;border:3px solid #4a4a4a;border-radius:0;overflow:hidden;background:#e9e9e9 var(--tex-bg) 0 0/24px 24px;image-rendering:pixelated}
.bar i{display:block;height:100%;width:0;transition:width .4s steps(8,end);background:#7a5230 var(--tex-fill) 0 0/24px 100%;image-rendering:pixelated;border-right:2px solid #3b2a18}
@keyframes stripe{to{background-position:34px 0}}
.combo{font-family:"Lilita One";color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink);font-size:1.3rem;min-width:52px;text-align:center}
.q{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:22px 18px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:6px 6px 0 var(--ink);animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.85) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.hint{color:var(--muted);font-weight:900;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.big{font-family:"Lilita One",sans-serif;font-weight:400;font-size:2.2rem;line-height:1.15;word-break:break-word;letter-spacing:.3px}
.emoji{font-size:3.2rem;line-height:1;animation:wig 3s ease-in-out infinite}
@keyframes wig{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(10deg)}}
.say{border:3px solid var(--ink);background:#b8a8ff;color:var(--ink);border-radius:999px;padding:6px 16px;font-weight:900;align-self:center;box-shadow:3px 3px 0 var(--ink)}
.say:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:15px 10px;font-weight:900;font-size:1.1rem;box-shadow:var(--sh);transition:transform .1s}
.opt:hover{transform:translate(-1px,-1px)}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opt.ok{background:#7cf0b0;animation:jump .4s}
.opt.bad{background:#ff9aa8;animation:shake .4s}
@keyframes jump{40%{transform:translateY(-8px) scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.art{font-family:"Lilita One";font-weight:400;font-size:1.7rem;color:#fff;text-shadow:2px 2px 0 var(--ink);letter-spacing:1px}
.art.le,.art.un{background:var(--der)} .art.la,.art.une{background:var(--die)} .art.les,.art.des{background:var(--das)}
.art.ok{outline:4px solid #fff;outline-offset:-9px} .art.bad{opacity:.35}
.inp{width:100%;font-size:1.4rem;padding:14px;border-radius:16px;border:3px solid var(--ink);font-family:inherit;font-weight:900;margin-top:16px;text-align:center;background:#fff;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.inp:focus{outline:none;background:#fffbe0}
.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.key{border:3px solid var(--ink);background:#fff;border-radius:12px;width:48px;height:44px;font-weight:900;font-size:1.2rem;box-shadow:3px 3px 0 var(--ink)}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.fb{margin-top:14px;border:3px solid var(--ink);border-radius:18px;padding:14px;font-weight:900;display:none;box-shadow:var(--sh);animation:popin .3s}
.fb.ok{display:block;background:#7cf0b0;color:var(--ink)}
.fb.bad{display:block;background:#ffd0d6;color:var(--ink)}
.fb .ans{font-family:"Lilita One";font-weight:400;font-size:1.35rem;display:block;margin-top:4px;letter-spacing:.3px}
.next{width:100%;margin-top:14px}
.der-t{color:var(--der)} .das-t{color:var(--das)} .die-t{color:var(--die)}
.card3d{perspective:900px;margin-top:6px}
.flip{position:relative;height:260px;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:3px solid var(--ink);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;box-shadow:6px 6px 0 var(--ink)}
.face.back{transform:rotateY(180deg);background:#8ee3f0}
.end{text-align:center;padding:10px 0}
.end .stars{font-size:3.4rem;letter-spacing:6px;animation:popin .6s cubic-bezier(.3,1.6,.5,1)}
.end h1{font-size:3rem}
.cal{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:16px;overflow:hidden;min-width:170px;align-self:center;box-shadow:var(--sh);transform:rotate(-2deg)}
.cal b{display:block;background:var(--die);color:#fff;padding:5px 12px;font-size:.95rem;border-bottom:3px solid var(--ink)}
.cal div{font-family:"Lilita One";font-size:2.8rem;line-height:1.1;padding:4px 12px 0}
.cal span{display:block;padding:0 12px 8px;font-weight:900;color:var(--muted)}
.tip{background:rgba(255,255,255,.75);border:3px dashed var(--ink);border-radius:16px;padding:10px 14px;font-size:.92rem;color:var(--ink);font-weight:800;margin-top:14px}
.why{margin-top:10px;padding-top:10px;border-top:3px dashed rgba(27,27,47,.25);font-weight:800;color:var(--ink);line-height:1.45}
.why b{color:#c4122f}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);font-family:"Lilita One";font-size:3.2rem;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.6,.5,1);z-index:50;white-space:nowrap}
.pop.show{opacity:1;transform:translate(-50%,-80%) scale(1) rotate(-4deg)}
.conf{position:fixed;top:-20px;width:11px;height:16px;z-index:40;pointer-events:none;border:2px solid var(--ink);border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.mute{font-size:.85rem;color:var(--ink);font-weight:800;margin-top:24px;text-align:center;opacity:.7}
select.inp{font-size:1rem;text-align:left}
input[type=range]{accent-color:var(--accent)}
@media (max-width:480px){.big{font-size:1.8rem}.opts{grid-template-columns:1fr}.opts.three{grid-template-columns:1fr 1fr 1fr}h1{font-size:1.5rem}.mascot{width:74px;height:74px}}

/* stats */
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.st{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--sh)}
.sti{font-size:1.5rem}.stv{font-family:"Lilita One";font-size:1.9rem;line-height:1.1}.stl{font-size:.82rem;color:var(--muted);font-weight:800}
.panel{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.sbars{display:flex;align-items:flex-end;gap:6px;height:170px}
.sb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;padding:0 1px}
.sb:hover .sbb{filter:brightness(1.1);outline:2px solid var(--ink)}
.sbb{width:100%;max-width:26px;background:#5fa83a;border-radius:4px 4px 0 0;min-height:0}
.sbv{font-size:.8rem;font-weight:900;color:var(--ink);height:16px}
.sbl{font-size:.72rem;color:var(--muted);font-weight:800;margin-top:4px;border-top:2px solid #cfd6de;width:100%;text-align:center;padding-top:3px}
.sbl.now{color:var(--ink)}
.cap{font-size:.8rem;color:var(--muted);font-weight:800;margin-top:10px}
.sk{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:10px;padding:6px 0}
.sk span{font-weight:800;font-size:.95rem}.sk b{text-align:right}
.skt{height:14px;background:#edf0f4;border-radius:4px;overflow:hidden}.skt i{display:block;height:100%;background:#2f7bff;border-radius:0 4px 4px 0}
.tkr{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed #e1e6ec}
.tkr:last-child{border-bottom:none}.tkr span{font-weight:800}.tkr small{color:var(--muted);font-weight:800;font-size:.75rem}
.tkr b{font-size:.9rem;color:#c4122f}.tkr b.g{color:#0f8a50}
.empty{color:var(--muted);font-weight:800;margin:0}
.tipbox{position:absolute;display:none;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font-size:.85rem;font-weight:800;pointer-events:none;z-index:60;max-width:260px}
@media (max-width:480px){.stg{grid-template-columns:repeat(2,1fr)}.sk{grid-template-columns:110px 1fr 42px}.tkr small{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="pop" id="pop">🪙</div>
<script>
/* ---------------- DATA (from Filipp's French notebook, Sept – Nov 2026) ---------------- */
const NUM=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf","vingt"];
function numWord(n){ if(n<=20) return NUM[n]; if(n===21) return "vingt et un"; if(n<30) return "vingt-"+NUM[n-20]; if(n===30) return "trente"; return "trente et un"; }
const DAYS=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const DAYS_EN=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MONTHS_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];

const TOPICS={
 greet:{name:"Les salutations",ic:"👋",items:[
  ["Bonjour !","Hello!","👋"],["Salut !","Hi! (informal)","🙋"],["Coucou !","Hey there! (friendly)","😊"],["Bonsoir !","Good evening!","🌇"],["Allô ?","Hello? (on the phone)","📞"],
  ["Ça va ?","How are you? / Are you OK?"],["Comment ça va ?","How are you?"],["Comment allez-vous ?","How are you? (polite)","🎩"],["Ça va bien, merci.","I'm fine, thank you."],
  ["Merci !","Thanks!","🙏"],["Enchanté !","Nice to meet you!","🤝"],["Et toi ?","And you?"],["Au revoir !","Goodbye!","👋"],["À bientôt !","See you soon!"],["À demain !","See you tomorrow!"],
  ["Bonne après-midi !","Good afternoon!","☀️"],["Bonne journée !","Have a great day!","🌞"],["oui","yes","✅"],["non","no","❌"]]},
 me:{name:"Je me présente",ic:"🙂",items:[
  ["Comment tu t'appelles ?","What's your name?"],["Je m'appelle Filipp.","My name is Filipp."],["Il s'appelle Max.","His name is Max."],["Elle s'appelle Léa.","Her name is Léa."],
  ["Quel âge as-tu ?","How old are you?"],["J'ai onze ans.","I'm eleven."],["Quel âge a-t-il ?","How old is he?"],["Elle a douze ans.","She is twelve."],
  ["le garçon","the boy","👦"],["l'ami","the friend (boy)","🧑"],["l'amie","the friend (girl)","👧"],["le copain","the friend / mate (boy)","🧑"],["la copine","the friend / mate (girl)","👧"]]},
 numbers:{name:"Les nombres 1–20",ic:"🔢",items:Array.from({length:20},(_,i)=>[numWord(i+1),String(i+1)])},
 classe:{name:"Les objets de la classe",ic:"🎒",items:[
  ["le livre","book","📕"],["le stylo","pen","🖊️"],["le crayon","pencil","✏️"],["le cahier","exercise book","📓"],["le sac","bag","👜"],["le sac à dos","backpack","🎒"],
  ["le cartable","school bag","💼"],["le taille-crayon","pencil sharpener","🔧"],["la gomme","rubber","🧽"],["la règle","ruler","📏"],["la trousse","pencil case","👝"],
  ["la table","table","🪑"],["la chaise","chair","💺"]]},
 colors:{name:"Les couleurs",ic:"🎨",items:[["rouge","red","🔴"],["noir","black","⚫"],["gris","grey","🩶"],["jaune","yellow","🟡"],["marron","brown","🟤"],["rose","pink","🩷"],
  ["blanc","white","⚪"],["violet","purple","🟣"],["bleu","blue","🔵"],["vert","green","🟢"],["orange","orange","🟠"],["arc-en-ciel","rainbow","🌈"]]},
 days:{name:"Les jours",ic:"📅",items:DAYS.map((d,i)=>[d,DAYS_EN[i]]).concat([["hier","yesterday","⬅️"],["aujourd'hui","today","📍"],["demain","tomorrow","➡️"],["le jour","the day","☀️"]])},
 months:{name:"Les mois",ic:"🗓️",items:MONTHS.map((m,i)=>[m,MONTHS_EN[i]]).concat([["C'est quand ton anniversaire ?","When is your birthday?","🎂"],["Mon anniversaire, c'est le 23 mars.","My birthday is on 23 March.","🎉"]])},
 likes:{name:"J'aime / je n'aime pas",ic:"❤️",items:[
  ["aimer","to like","❤️"],["adorer","to love","😍"],["détester","to hate","😖"],["J'aime","I like"],["J'adore","I love"],["Je déteste","I hate"],["Je n'aime pas","I don't like","👎"],["mais","but"],["et","and"],
  ["les chats","cats","🐱"],["les chiens","dogs","🐶"],["le sport","sport","🏅"],["les jeux vidéo","video games","🎮"],["les bonbons","sweets","🍬"],["le chocolat","chocolate","🍫"],
  ["la pizza","pizza","🍕"],["la musique","music","🎵"],["le foot","football","⚽"],["le basket","basketball","🏀"],["les insectes","insects","🐞"],["le shopping","shopping","🛍️"],["le français","French (the subject)","🇫🇷"],
  ["Qu'est-ce que tu aimes ?","What do you like?"],["Qu'est-ce que tu n'aimes pas ?","What don't you like?"]]},
 vocab:{name:"Verbes & questions",ic:"❓",items:[
  ["jouer","to play","🎲"],["parler","to talk","🗣️"],["écouter","to listen","🎧"],["regarder","to watch / look at","📺"],["manger","to eat","🍽️"],["avoir","to have","🤲"],
  ["avec","with","🤝"],["ensemble","together","👫"],["parce que","because"],["la mode","fashion / style","👗"],["le groupe","band / group","🎸"],["dans","in","📦"],
  ["il y a","there is / there are"],["il n'y a pas de","there is no / there are no"],
  ["qui ?","who?"],["comment ?","how?"],["quand ?","when?","⏰"],["où ?","where?","📍"],["pourquoi ?","why?"],["qu'est-ce que… ?","what…?"],["est-ce que… ?","do you…? (yes/no question)"]]}
};
Object.values(TOPICS).forEach(t=>t.items=t.items.map(([de,en,e])=>({de,en,e:e||""})));

/* nouns with le / la / les (for the article and colour games) */
const NOUNS=Object.values(TOPICS).flatMap(t=>t.items).filter(x=>/^(le|la|les) \S/.test(x.de)&&!/[?.!]/.test(x.de)&&x.de!=="le groupe"&&x.de!=="la mode").map(x=>{const [g,...r]=x.de.split(" ");return{g,w:r.join(" "),en:x.en,e:x.e}});
const OBJ=NOUNS.filter(n=>TOPICS.classe.items.some(x=>x.de===n.g+" "+n.w)&&!/ /.test(n.w)&&n.w!=="taille-crayon");

const PERS=["je (j')","tu","il / elle","nous","vous","ils / elles"];
const er=st=>[st+"e",st+"es",st+"e",st+"ons",st+"ez",st+"ent"];
const VERBS={
 avoir:{en:"to have",f:["ai","as","a","avons","avez","ont"]},
 "s'appeler":{en:"to be called",f:["m'appelle","t'appelles","s'appelle","nous appelons","vous appelez","s'appellent"]},
 jouer:{en:"to play",f:er("jou")},
 aimer:{en:"to like",f:er("aim")},
 adorer:{en:"to love",f:er("ador")},

function articleNote(de){ const m=de.match(/^(le|la|les) (.+)$/); if(!m) return "";
  return ` <b>${m[1]}</b> = ${GENDER[m[1]]}${m[1]==="les"?"":` (a/an: <b>${m[1]==="le"?"un":"une"}</b>)`}. Always learn a noun with le or la.`; }
function verbRule(pi,v){
  if(v==="avoir") return `<b>avoir</b> (to have) is irregular — learn it by heart: j'<b>ai</b>, tu <b>as</b>, il/elle <b>a</b>, nous <b>avons</b>, vous <b>avez</b>, ils/elles <b>ont</b>.`;
  if(v==="s'appeler") return `s'appeler: je <b>m'appelle</b>, tu <b>t'appelles</b>, il/elle <b>s'appelle</b> — double <b>ll</b>, and tu ends in <b>-s</b>.`;
  const st=v.slice(0,-2), end=["e","es","e","ons","ez","ent"][pi];
  let t=`<b>${v}</b> is an -er verb: take away <b>-er</b> → <b>${st}</b>, then add the ending for ${PERS[pi]}: <b>-${end}</b>. (je -e, tu -es, il/elle -e, nous -ons, vous -ez, ils/elles -ent)`;
  if(v==="manger"&&pi===3) t+=" Careful: nous mang<b>e</b>ons keeps the e so it sounds soft.";
  if(pi===1) t+=" The -s of tu is silent, but you must write it!";
  if(pi===5) t+=" The -ent of ils/elles is silent, but you must write it!";
  return t;
}
function explain(q){
  switch(q.type){
  case "words": return `“${esc(q.it.de)}” means “${esc(q.it.en)}”.`+articleNote(q.it.de);
  case "spell": return `“${esc(q.it.en)}” in French is <b>${esc(q.it.de)}</b>.`+articleNote(q.it.de)+accentNote(q.it.de);
  case "hoeren": return q.ask.startsWith("You hear a question")?`The question was “${esc(q.say)}” = “${esc(DLG_EN[q.say]||"")}”. Answer: “${esc(q.a)}” = “${esc(DLG_EN[q.a]||q.a)}”.`:`“${esc(q.say)}” means “${esc(q.a)}”.`;
  case "artikel": { const n=q.n, tip=NOUN_TIP[n.w]||"";
    if(n.g==="les") return `${esc(n.w)} (${esc(n.en)}) is plural — you can see the <b>-s</b> → <b>les ${esc(n.w)}</b>. Plural is always <b>les</b> (the) or <b>des</b> (some).`;
    return `${esc(n.w)} (${esc(n.en)}) is ${GENDER[n.g]} → <b>${n.g} ${esc(n.w)}</b>, <b>${n.g==="le"?"un":"une"} ${esc(n.w)}</b>. Masculine: le / un · feminine: la / une. ${tip}`; }
  case "verbs": { const [pi,v]=q.s; return verbRule(pi,v); }
  case "praep": { const k=q.pl?"plural":q.g==="la"?"feminine":"masculine", f=POSS[q.who];
    return `<b>${esc(q.post)}</b> is ${k} → <b>${q.a}</b>. ${q.who}: masculine <b>${f[0]}</b> · feminine <b>${f[1]}</b> · plural <b>${f[2]}</b>.${q.who==="his / her"?" Son / sa / ses depends on the THING, not on the boy or girl: sa trousse can be his or her pencil case.":""}`; }
  case "caps": { const steps=[`${q.base}`]; let f=q.base;
    if(q.fem){ if(f.endsWith("e")) steps.push(`feminine, but ${f} already ends in -e → no change`); else { f+="e"; steps.push(`feminine → + e → ${f}`);} }
    if(q.pl){ if(f.endsWith("s")) steps.push(`plural, but it already ends in -s → no change`); else { f+="s"; steps.push(`plural → + s → ${f}`);} }
    return `The colour agrees with the noun: ${steps.join(" · ")}. Answer: <b>${q.a}</b>. And the colour comes AFTER the noun: un cahier <b>vert</b>.`; }
  case "neg": { const [p,c]=q.s; let t=`Put <b>ne</b> before the verb and <b>pas</b> after it: ${esc(c)}`;
    if(/n'/.test(c)) t+=` Before a vowel (a, e, i, o, u, h) <b>ne</b> becomes <b>n'</b>: je n'aime, je n'ai, il n'y a.`;
    if(/\b(un|une|des)\b/.test(p)&&/pas de\b|pas d'/.test(c)) t+=` After <b>pas</b>, un / une / des become <b>de</b>: J'ai un cahier → Je n'ai pas <b>de</b> cahier.`;
    return t; }
  case "dialog": { const d=q.d;
    if(d.q.includes("___")){ const full=d.q.replace("___",d.a);
      if(/^[🌇👋📞🤝🎩]/u.test(d.q)) return `Bonjour = hello (daytime) · Bonsoir = good evening · Allô = hello on the phone · Enchanté = nice to meet you · Au revoir = goodbye · Comment allez-vous ? = how are you (polite).`;
      if(d.a==="mais"||d.a==="parce que") return `<b>mais</b> = but · <b>parce que</b> = because · <b>et</b> = and · <b>avec</b> = with.`;
      return `Qui = who · Comment = how · Quand = when · Où = where · Pourquoi = why. → <b>${esc(full)}</b>`; }
    return `“${esc(d.q)}” = “${esc(DLG_EN[d.q]||d.q)}” → “${esc(d.a)}” = “${esc(DLG_EN[d.a]||d.a)}”.`; }
  case "num": { const n=q.n, w=numWord(n);
    if(n<=16) return `${n} = <b>${w}</b>. Numbers 1–16 you learn by heart.${n===4?" Spelling: q-u-a-t-r-e.":n===14?" Spelling: q-u-a-t-o-r-z-e (quatre → quatorze).":n===2?" Spelling: d-e-u-x.":n===7?" The p in sept is silent, but you write it.":""}`;
    if(n<20) return `17–19 = <b>dix</b> + 7 / 8 / 9 with a hyphen: ${n} = <b>${w}</b>.`;
    return `20 = <b>vingt</b> (the g and t are silent).`; }
  case "datum": { const d=q.d, wd=(d.getDay()+6)%7, m=d.getMonth();
    if(q.mode==="write") return `${DAYS_EN[wd]} = <b>${DAYS[wd]}</b>, ${MONTHS_EN[m]} = <b>${MONTHS[m]}</b>. French order: day, number, month — <b>${DAYS[wd]} ${d.getDate()} ${MONTHS[m]}</b>. No “the”, no “th”.`;
    return `hier = yesterday · aujourd'hui = today · demain = tomorrow. The week: lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche.`; }
  case "abc": return `${esc(q.name)} = ${[...q.name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")].map(c=>`${c.toUpperCase()} “${ABC[c]||c}”`).join(", ")}.`;
  case "satz": { if(/\bne\b|\bn'/.test(q.s)) return `Negative: <b>ne</b> (n') + verb + <b>pas</b>: ${esc(q.s)}`;
    if(/^(Comment|Quel|Qu'est-ce)/.test(q.s)) return `The question word comes first: ${esc(q.s)}`;
    return `Who + verb + the rest. Colours come after the noun: ${esc(q.s)}`; }
  case "lesen": return q.q[3]?`Look at the text: “${esc(q.q[3])}”`:"";
  }
  return "";
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFC").replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/\s+([,.!?])/g,"$1").replace(/,(\S)/g,", $1").replace(/\.(\p{L})/gu,". $1").trim();
const loose=s=>norm(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe");
function check(input,answer,strict){ // 'ok' | 'case' | 'umlaut' | 'punct' | 'bad'. strict = punctuation counts (sentence-writing games)
  const a=norm(input), b=norm(answer);
  if(a===b) return "ok";
  const bare=x=>x.replace(/(?<!\d)[.,!?;:¡¿]/g," ").replace(/\s+/g," ").trim(); // keeps the dot in "4." dates
  if(strict){
    if(bare(a)===bare(b)) return "punct";
    if(bare(a).toLowerCase()===bare(b).toLowerCase()) return "case";
  } else {
    if(bare(a)===bare(b)) return "ok";
    if(bare(a).toLowerCase()===bare(b).toLowerCase()){
      // a capital after a sentence end inside the answer only follows from punctuation, which doesn't count here
      const ta=bare(a).split(" "), tb=b.split(" ").filter(w=>bare(w)), te=tb.map((w,i)=>i>0&&/[.!?]$/.test(tb[i-1]));
      return tb.length===ta.length&&tb.every((w,i)=>bare(w)===ta[i]||te[i])?"ok":"ok";
    }
  }
  if(bare(loose(a))===bare(loose(b))) return "umlaut";
  return "bad";
}
function punctTip(v,right){
  const a=norm(v), endR=right.trim().slice(-1), endA=a.slice(-1);
  const inner=x=>(x.slice(0,-1).match(/(?<!\d)[.!?]/g)||[]).length;
  if(inner(right)>inner(a)) return "two sentences → put a full stop between them.";
  if(endR==="?"&&endA!=="?") return "it's a question → it ends with a question mark <b>?</b>";
  if(/[.!?]/.test(endR)&&!/[.!?]/.test(endA)) return "don't forget the full stop <b>.</b> at the end!";
  if(endR==="."&&endA!==".") return "this is not a question → it ends with a full stop <b>.</b>";
  return "check the commas and full stops.";
}

function tone(freqs,dur,type,vol){ if(S.sfx===false) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  let t=actx.currentTime; freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain(); o.type=type||"triangle"; o.frequency.value=f;
   g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.18,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+dur);
   o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); t+=dur*.7;}); }catch(e){} }

const dayKey=d=>{d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function itemInfo(q){ // key + label + compact question for replay
  switch(q.type){
   case "words": case "spell": return {k:"w:"+q.it.de,l:`${q.it.de} = ${q.it.en}`,q:{type:q.type,it:q.it,dir:q.dir}};
   case "hoeren": return {k:"h:"+q.say,l:`🎧 ${q.say}`,q};
   case "artikel": { const r=artRight(q); return {k:"a:"+q.n.w+(q.indef?"|i":""),l:`${r} ${q.n.w}`,q}; }
   case "verbs": return {k:"v:"+q.s.join("|"),l:verbFull(q.s),q};
   case "praep": return {k:"p:"+q.a+" "+q.post,l:`${q.a} ${q.post} (${q.en})`,q};
   case "dialog": return {k:"d:"+q.d.q,l:q.d.q.includes("___")?q.d.q.replace("___",q.d.a):`${q.d.q} → ${q.d.a}`,q};

   case "neg": return {k:"g:"+q.s[0],l:q.s[1],q};
   case "num": return {k:"n:"+q.n,l:`${q.n} = ${numWord(q.n)}`,q};

function track(q,ok){
  if(!q) return; const dk=dayKey(); const d=S.days[dk]=S.days[dk]||{q:0,ok:0}; d.q++; if(ok) d.ok++;
  const t=S.types[q.type]=S.types[q.type]||{q:0,ok:0}; t.q++; if(ok) t.ok++;
  const it=itemInfo(q); if(!it) return;
  const r=S.items[it.k]=S.items[it.k]||{w:0,r:0,l:it.l,t:q.type,q:it.q};
  if(ok) r.r++; else r.w++; r.l=it.l; r.q=it.q;
  const keys=Object.keys(S.items); if(keys.length>400){ keys.sort((a,b)=>(S.items[a].w-S.items[a].r)-(S.items[b].w-S.items[b].r)).slice(0,keys.length-400).forEach(k=>delete S.items[k]); }
  save();
}

function pool(){return [...selTopics].flatMap(t=>TOPICS[t].items.map(x=>Object.assign({t},x)));}

function makeQuestions(g){
  const N=10, out=[];
  if(g==="words"||g==="spell"||g==="cards"){
    const p=pool(); let list=shuffle(p); while(list.length<N && g!=="cards") list=list.concat(shuffle(p));
    return g==="cards"?list:list.slice(0,N).map(it=>({type:g,it,dir:Math.random()<.5?"de":"en",p}));
  }
  if(g==="artikel") return shuffle(NOUNS.concat(shuffle(NOUNS))).slice(0,N).map(n=>({type:"artikel",n,indef:n.g!=="les"&&Math.random()<.35}));
  if(g==="verbs") return shuffle(SENT).slice(0,N).map(s=>({type:"verbs",s,mode:Math.random()<.5?"type":"pick"}));
  if(g==="numbers"){ for(let i=0;i<N;i++){const n=1+Math.floor(Math.random()*20); out.push({type:"num",n,mode:rnd(canSpeak?["hear","read","write"]:["read","write"])});} return out; }
  if(g==="datum"){ for(let i=0;i<N;i++){ const d=new Date(2026,Math.floor(Math.random()*12),1+Math.floor(Math.random()*28)); out.push({type:"datum",d,mode:i%2?"rel":"write",back:Math.random()<.4});} return out; }
  if(g==="dialog") return shuffle(DIALOG).slice(0,N).map(d=>({type:"dialog",d}));
  if(g==="caps") return Array.from({length:N},()=>capsQ());
  if(g==="neg") return shuffle(NEG).slice(0,N).map(s=>({type:"neg",s}));
  if(g==="praep") return Array.from({length:N},()=>praepQ());
  if(g==="abc") return shuffle(NAMES).slice(0,N).map((name,i)=>({type:"abc",name,mode:canSpeak&&i%2===0?"hear":"read"}));
  if(g==="satz") return shuffle(ORDER).slice(0,N).map(s=>({type:"satz",s}));
  if(g==="lesen") return shuffle(READ.flatMap(r=>r.q.map(q=>({type:"lesen",t:r.t,q})))).slice(0,N);
  if(g==="hoeren") return Array.from({length:N},()=>hoerenQ());
  if(g==="tricky") return trickyQuestions();
  if(g==="test"){
    const all=Object.values(TOPICS).flatMap(t=>t.items.map(x=>({t:t.name,...x}))).filter(x=>!/[?.!]$/.test(x.de)||x.de.length<22);
    const mk={
      artikel:()=>({type:"artikel",n:rnd(NOUNS),indef:Math.random()<.3}),
      neg:()=>({type:"neg",s:rnd(NEG)}),
      verbs:()=>({type:"verbs",s:rnd(SENT),mode:rnd(["type","pick"])}),
      dialog:()=>({type:"dialog",d:rnd(DIALOG)}),
      praep:praepQ,
      caps:capsQ,
      num:()=>({type:"num",n:1+Math.floor(Math.random()*20),mode:rnd(canSpeak?["hear","read","write"]:["read","write"])}),
      words:()=>({type:"words",it:rnd(all),dir:rnd(["de","en"]),p:all}),
      spell:()=>({type:"spell",it:rnd(all.filter(x=>!/^\d/.test(x.en)))}),
      lesen:()=>{const r=rnd(READ);return{type:"lesen",t:r.t,q:rnd(r.q)}},
      satz:()=>({type:"satz",s:rnd(ORDER)}),
      abc:()=>({type:"abc",name:rnd(NAMES),mode:canSpeak?"hear":"read"}),
      hoeren:hoerenQ
    };
    let kinds=["artikel","verbs","verbs","verbs","dialog","dialog","praep","caps","neg","num","words","spell","lesen"];
    if(canSpeak) kinds.push("hoeren","hoeren"); else kinds.push("words","dialog");
    const seen=new Set(), qs=[];
    for(const k of shuffle(kinds)){ let q, tries=0; do{ q=mk[k](); tries++; }while(seen.has(JSON.stringify(q))&&tries<10); seen.add(JSON.stringify(q)); qs.push(q); }
    return qs;
  }
}
function praepQ(){
  const n=rnd(OBJ), who=rnd(Object.keys(POSS)), pl=Math.random()<.3, i=pl?2:(n.g==="la"?1:0);
  const post=pl?n.w+"s":n.w, en=(who==="his / her"?"his / her":who)+" "+n.en+(pl?"s":"");
  return {type:"praep",who,post,a:POSS[who][i],o:POSS[who],en,g:n.g,pl};
}
function capsQ(){
  const n=rnd(OBJ), c=rnd(COLS), pl=Math.random()<.5, fem=n.g==="la";
  const num=pl?rnd(["deux","trois","quatre","des"]):(fem?"une":"un"), noun=pl?n.w+"s":n.w;
  let a=c[0]; if(fem&&!a.endsWith("e")) a+="e"; if(pl&&!a.endsWith("s")) a+="s";
  return {type:"caps",c:`${num} ${noun} (${c[0]})`,pre:`J'ai ${num} ${noun}`,a,base:c[0],fem,pl,full:`J'ai ${num} ${noun} ${a}.`,en:c[1]};
}
const artRight=q=>q.indef?(q.n.g==="le"?"un":"une"):q.n.g;
const verbFull=s=>{const [pi,v,b,a]=s, f=VERBS[v].f[pi]; return ((b?b+(b.endsWith("'")?"":" "):"")+f+(a?(a.startsWith("?")?" ":" ")+a:"")).trim();};
function hoerenQ(){
  const r=Math.random();
  if(r<.3){ const d=rnd(DIALOG.filter(x=>!x.q.includes("___"))); return {type:"hoeren",say:d.q,ask:"You hear a question. What is the best answer?",a:d.a,o:d.o}; }
  const groups=["colors","days","months","greet","classe","likes","vocab"];
  const t=TOPICS[rnd(groups)], it=rnd(t.items);
  const o=[it.en,...shuffle(t.items.filter(x=>x.en!==it.en)).slice(0,3).map(x=>x.en)];
  return {type:"hoeren",say:it.de,ask:"What did you hear?",a:it.en,o};
}

function start(g){ G={g,qs:makeQuestions(g),i:0,score:0,combo:0,answered:false}; if(g==="cards") return cards(); render(); }

function shell(inner){
  const pct=G.i/G.qs.length*100;
  $("#app").innerHTML=`<div class="top"><button class="x" id="quit" aria-label="Back">✕</button><div class="bar"><i style="width:${pct}%"></i></div>${G.combo>=2?`<span class="combo">🔥x${G.combo}</span>`:""}<span class="pill">🪙 ${G.score}</span></div>${inner}`;
  $("#quit").onclick=home;
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
}
const keysHTML=`<div class="keys">${["é","è","ê","à","ç","â","ô","û","î"].map(k=>`<button class="key" data-k="${k}">${k}</button>`).join("")}</div>`;
function wireKeys(){ const inp=$("#inp"); document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s; inp.value=inp.value.slice(0,s)+b.dataset.k+inp.value.slice(e); inp.focus(); inp.setSelectionRange(s+1,s+1);}); }
const fbHTML=`<button class="btn ghost next" id="idk" style="box-shadow:none;border-style:dashed;color:var(--muted)">🤷 I don't know — show me</button><div class="fb" id="fb"></div><button class="btn next" id="next" style="display:none">Next →</button>`;

function render(){
  if(G.i>=G.qs.length) return finish();
  G.answered=false; G.reveal=null;
  const q=G.qs[G.i];
  let html="", after=null;
  if(q.type==="words"){
    const it=q.it, showDe=q.dir==="de";
    const others=shuffle(q.p.filter(x=>x.de!==it.de && x.en!==it.en)).slice(0,3);
    const opts=shuffle([it,...others]);
    html=`<div class="q"><div class="hint">${showDe?"What does it mean?":"How do you say it in French?"}</div>${it.e&&it.t!=="numbers"?`<div class="emoji">${it.e}</div>`:""}
      <div class="big">${esc(showDe?it.de:it.en)}</div>${showDe?sayBtn(it.de):""}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o.de)}">${esc(showDe?o.en:o.de)}</button>`).join("")}</div>${fbHTML}`;
    after=()=>pickWire(it.de, showDe?null:it.de, `${it.de} = ${it.en}`);
  }
  else if(q.type==="spell"){
    const it=q.it;
    html=`<div class="q"><div class="hint">Write it in French</div>${it.e?`<div class="emoji">${it.e}</div>`:""}<div class="big">${esc(it.en)}</div>${sayBtn(it.de)}</div>
      <input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here…">${keysHTML}
      <button class="btn next" id="go">Check</button>${fbHTML}`;
    after=()=>typeWire(it.de, it.t==="classe"?"Don't forget le / la!":"");
  }
  else if(q.type==="artikel"){
    const n=q.n, right=artRight(q), opts=q.indef?["un","une"]:["le","la","les"];
    html=`<div class="q"><div class="hint">${q.indef?"un or une? (a / an)":"le, la or les? (the)"}</div><div class="emoji">${n.e}</div><div class="big">___ ${esc(n.w)}</div><div style="color:var(--muted);font-weight:700">${q.indef?"a ":"the "}${esc(n.en.replace(/^the /,""))}</div></div>
      <div class="opts ${opts.length===3?"three":""}">${opts.map(a=>`<button class="opt art ${a}" data-v="${a}">${a}</button>`).join("")}</div>${fbHTML}`;
    after=()=>pickWire(right, `${right} ${n.w}`, `<b>${right}</b> ${esc(n.w)}`, true);
  }
  else if(q.type==="verbs"){
    const [pi,v,b,a]=q.s, ans=VERBS[v].f[pi];
    const full=verbFull(q.s);
    const sentence=`${esc(b)}${b.endsWith("'")?"":" "}<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> ${esc(a)}`;
    html=`<div class="q"><div class="hint">${v} · ${VERBS[v].en}</div><div class="big">${sentence}</div><div style="color:var(--muted);font-weight:700">person: ${PERS[pi]}</div></div>`;
    if(q.mode==="pick"){
      const opts=[...new Set([ans,v,...shuffle(VERBS[v].f)])].slice(0,4);
      html+=`<div class="opts">${shuffle(opts).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${fbHTML}`;
      after=()=>pickWire(ans, full, esc(full));
    } else {
      html+=`<input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(v)} → ?">${keysHTML}<button class="btn next" id="go">Check</button>${fbHTML}`;
      after=()=>typeWire(ans, "", full);
    }
    html+=`<div class="tip">-er verbs: je <b>-e</b> · tu <b>-es</b> · il/elle <b>-e</b> · nous <b>-ons</b> · vous <b>-ez</b> · ils/elles <b>-ent</b> &nbsp;|&nbsp; avoir: j'<b>ai</b>, tu <b>as</b>, il <b>a</b>, nous <b>avons</b>, vous <b>avez</b>, ils <b>ont</b></div>`;
  }
  else if(q.type==="praep"){
    const full=`${q.a} ${q.post}`;
    html=`<div class="q"><div class="hint">${q.o.join(", ")}?</div><div class="emoji">🎒</div>
      <div class="big" style="font-size:1.9rem"><u>&nbsp;&nbsp;?&nbsp;&nbsp;</u> ${esc(q.post)}</div><div style="color:var(--muted);font-weight:700">${esc(q.en)}</div></div>
      <div class="opts three">${q.o.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join("")}</div>${fbHTML}
      <div class="tip">masculine → <b>mon / ton / son</b> · feminine → <b>ma / ta / sa</b> · plural → <b>mes / tes / ses</b></div>`;
    after=()=>pickWire(q.a, full, esc(full));
  }
  else if(q.type==="neg"){
    const [p,c,w1,w2]=q.s;
    html=`<div class="q"><div class="hint">Make it negative (ne … pas)</div><div class="emoji">🚫</div><div class="big" style="font-size:1.6rem">${esc(p)}</div></div>
      <div class="opts" style="grid-template-columns:1fr">${shuffle([c,w1,w2]).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${fbHTML}
      <div class="tip"><b>ne</b> + verb + <b>pas</b> · before a vowel <b>n'</b> · un / une / des → <b>de</b></div>`;
    after=()=>pickWire(c, c, esc(c));
  }
  else if(q.type==="abc"){
    const sp=spellOut(q.name);
    html=`<div class="q"><div class="hint">Comment ça s'écrit ? Write the name</div><div class="emoji">🔤</div>
      ${q.mode==="hear"?`<button class="say" data-say="${esc(sp.replace(/ – /g,", "))}" style="font-size:1.2rem;padding:10px 22px">🔊 Play</button>`:`<div class="big" style="font-size:1.45rem">${esc(sp)}</div>`}</div>
      <input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="name…"><button class="btn next" id="go">Check</button>${fbHTML}
      <div class="tip">${Object.entries(ABC).map(([k,v])=>k+" "+v).join(" · ")}</div>`;
    after=()=>{ typeWire(q.name,"",q.name+"  ("+sp+")"); if(q.mode==="hear") setTimeout(()=>say(sp.replace(/ – /g,", ")),250); };
  }
  else if(q.type==="satz"){
    const words=q.s.replace(/[.?!]$/,"").replace(/,/g,"").split(" "), end=q.s.slice(-1);
    let order=shuffle(words); if(order.join(" ")===words.join(" ")&&words.length>1) order=order.reverse();
    html=`<div class="q"><div class="hint">Put the words in the right order</div><div class="big" id="built" style="font-size:1.6rem;min-height:2.4rem">…</div></div>
      <div class="chips" id="pool" style="justify-content:center;margin-top:14px">${order.map((w,i)=>`<button class="chip" data-i="${i}" style="font-size:1.1rem">${esc(w)}</button>`).join("")}</div>
      <div class="row"><button class="btn ghost" id="undo" style="flex:1">↺ Reset</button><button class="btn" id="go" style="flex:2">Check</button></div>${fbHTML}`;
    after=()=>{
      let picked=[];
      const upd=()=>{$("#built").textContent=picked.length?picked.map(i=>order[i]).join(" ")+(picked.length===words.length?end:""):"…";
        document.querySelectorAll("#pool .chip").forEach(c=>{c.disabled=picked.includes(+c.dataset.i); c.style.opacity=c.disabled?.25:1;});};
      document.querySelectorAll("#pool .chip").forEach(c=>c.onclick=()=>{ if(G.answered) return; picked.push(+c.dataset.i); upd(); });
      $("#undo").onclick=()=>{ if(G.answered) return; picked=[]; upd(); };
      G.reveal=()=>{ say(q.s); $("#undo").style.display="none"; $("#built").textContent=q.s; result(false,`No problem — now you know! <span class="ans">${esc(q.s)}</span>`); };
      $("#go").onclick=()=>{ if(G.answered||picked.length<words.length) return;
        const ok=picked.map(i=>order[i]).join(" ")===words.join(" ");
        say(q.s); $("#undo").style.display="none";
        result(ok, ok?`Super! <span class="ans">${esc(q.s)}</span>`:`Not quite. <span class="ans">${esc(q.s)}</span>`); };
    };
  }
  else if(q.type==="lesen"){
    const [ques,ans,opts]=q.q;
    html=`<div class="q" style="text-align:left"><div class="hint">Read</div><div style="font-size:1.15rem;font-weight:700;line-height:1.55;white-space:pre-line">${esc(q.t)}</div>${sayBtn(q.t.replace(/[•▲■]/g,""))}</div>
      <div style="font-weight:800;margin-top:14px;font-size:1.1rem">${esc(ques)}</div>
      <div class="opts" style="grid-template-columns:1fr">${shuffle(opts).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${fbHTML}`;
    after=()=>pickWire(ans,null,esc(ans));
  }
  else if(q.type==="hoeren"){
    html=`<div class="q"><div class="hint">${esc(q.ask)}</div><div class="emoji">🎧</div><button class="say" data-say="${esc(q.say)}" style="font-size:1.2rem;padding:10px 22px">🔊 Play again</button></div>
      <div class="opts">${shuffle(q.o).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${fbHTML}`;
    after=()=>{ pickWire(q.a,null,`You heard: <b>${esc(q.say)}</b><br>${esc(q.a)}`); setTimeout(()=>say(q.say),250); };
  }
  else if(q.type==="num"){
    const n=q.n, w=numWord(n);
    if(q.mode==="hear"){
      html=`<div class="q"><div class="hint">Listen and type the number</div><div class="emoji">👂</div><button class="say" data-say="${w}" style="font-size:1.2rem;padding:10px 22px">🔊 Play</button></div>
      <input class="inp" id="inp" inputmode="numeric" autocomplete="off" placeholder="1–20"><button class="btn next" id="go">Check</button>${fbHTML}`;
      after=()=>{typeWire(String(n),"",`${n} = ${w}`); setTimeout(()=>say(w),250);};
    } else if(q.mode==="read"){
      const others=new Set([w]); while(others.size<4) others.add(numWord(1+Math.floor(Math.random()*20)));
      html=`<div class="q"><div class="hint">Which word is this number?</div><div class="big" style="font-size:3.2rem">${n}</div></div>
      <div class="opts">${shuffle([...others]).map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join("")}</div>${fbHTML}`;
      after=()=>pickWire(w,w,`${n} = ${w}`);
    } else {
      html=`<div class="q"><div class="hint">Write the number as a word</div><div class="big" style="font-size:3.2rem">${n}</div></div>
      <input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="in French…">${keysHTML}<button class="btn next" id="go">Check</button>${fbHTML}`;
      after=()=>typeWire(w,"",`${n} = ${w}`);
    }
  }
  else if(q.type==="datum"){
    const d=q.d, wd=(d.getDay()+6)%7, day=d.getDate(), m=d.getMonth();
    const cal=`<div class="cal"><b>${DAYS_EN[wd]}</b><div>${day}</div><span>${MONTHS_EN[m]}</span></div>`;
    if(q.mode==="write"){
      const ans=`${DAYS[wd]} ${day} ${MONTHS[m]}`;
      html=`<div class="q"><div class="hint">Write the date in French</div>${cal}</div>
      <input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="lundi 1 janvier">${keysHTML}<button class="btn next" id="go">Check</button>${fbHTML}
      <div class="tip">day + number + month — e.g. <b>mercredi 4 novembre</b>. Accents: f<b>é</b>vrier, ao<b>û</b>t, d<b>é</b>cembre.</div>`;
      after=()=>typeWire(ans,"",ans,true);
    } else {
      const ans=DAYS[(wd+(q.back?6:1))%7];
      html=`<div class="q"><div class="hint">Finish the sentence</div><div class="big" style="font-size:1.5rem">Aujourd'hui, c'est ${DAYS[wd]}.<br>${q.back?"Hier":"Demain"}, c'est <u>&nbsp;&nbsp;?&nbsp;&nbsp;</u>.</div></div>
      <input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.back?"hier":"demain"} → …">${keysHTML}<button class="btn next" id="go">Check</button>${fbHTML}
      <div class="tip">hier = yesterday · aujourd'hui = today · demain = tomorrow</div>`;
      after=()=>typeWire(ans,"",`${q.back?"Hier":"Demain"}, c'est ${ans}.`);
    }
  }
  else if(q.type==="dialog"){
    const d=q.d, gap=d.q.includes("___");
    html=`<div class="q"><div class="hint">${gap?"Fill the gap":"What is the best answer?"}</div><div class="emoji">💬</div><div class="big" style="font-size:1.7rem">${esc(d.q)}</div>${gap?"":sayBtn(d.q)}</div>
      <div class="opts ${gap?"three":""}">${shuffle(d.o).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${fbHTML}`;
    after=()=>pickWire(d.a, gap?d.q.replace("___",d.a):d.a, esc(gap?d.q.replace("___",d.a):d.q+" — "+d.a));
  }
  else if(q.type==="caps"){
    html=`<div class="q"><div class="hint">Write the colour so it matches the noun</div><div class="emoji">🎨</div><div class="big" style="font-size:1.6rem">${esc(q.pre)} <u>&nbsp;&nbsp;?&nbsp;&nbsp;</u></div><div style="color:var(--muted);font-weight:700">colour: ${esc(q.base)} (${esc(q.en)})</div></div>
      <input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(q.base)} → ?"><button class="btn next" id="go">Check</button>${fbHTML}
      <div class="tip">feminine (la / une) → <b>+e</b> · plural → <b>+s</b> · both → <b>+es</b> · already ends in -e (rouge, jaune, rose) → no extra e</div>`;
    after=()=>typeWire(q.a,"",q.full);
  }
  shell(html); after&&after();
  const idk=$("#idk"); if(idk) idk.onclick=()=>{ if(!G.answered && G.reveal) G.reveal(); };
}

function result(ok,msg){
  try{ track(G.qs[G.i],ok); }catch(e){}
  G.answered=true;
  if(ok){G.score++; S.xp++; G.combo=(G.combo||0)+1; save(); sfxOk(); confetti(G.combo>=3?28:12);
    pop(G.combo>=3?`${G.combo}x COMBO! +1🪙`:"+1 🪙");
    if(S.xp%XP_PER===0) setTimeout(()=>{pop(`LEVEL ${levelInfo().n}!`); confetti(60); sfxWin();},700);
  } else { G.combo=0; sfxBad(); }
  if(!ok){ let ex=""; try{ ex=explain(G.qs[G.i]); }catch(e){} if(ex) msg+=`<div class="why">💡 <span style="color:var(--muted)">Why?</span> ${ex}</div>`; }
  const fb=$("#fb"); fb.className="fb "+(ok?"ok":"bad"); fb.innerHTML=msg;
  const nx=$("#next"); nx.style.display="block"; const ik=$("#idk"); if(ik) ik.style.display="none"; const go=$("#go"); if(go) go.style.display="none";
  nx.onclick=()=>{G.i++; render();}; nx.focus();
}
function pickWire(right, speak, explain, isArt){
  G.reveal=()=>{ document.querySelectorAll(".opt").forEach(x=>{ if(x.dataset.v===right) x.classList.add("ok"); else if(isArt) x.classList.add("bad"); });
    if(speak) say(speak); result(false,`No problem — now you know! <span class="ans">${explain}</span>`); };
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(G.answered) return;
    const ok=b.dataset.v===right;
    document.querySelectorAll(".opt").forEach(x=>{ if(x.dataset.v===right) x.classList.add("ok"); else if(x===b) x.classList.add("bad"); else if(isArt) x.classList.add("bad"); });
    if(speak) say(speak);
    result(ok, ok?`${rnd(["Super !","Bravo !","Très bien !","Génial !","Parfait !"])} <span class="ans">${explain}</span>`:`Not quite. <span class="ans">${explain}</span>`);
  });
}
function typeWire(right, extraTip, shown, isDate, isCaps){
  const inp=$("#inp"); wireKeys(); setTimeout(()=>inp.focus(),50);
  const go=()=>{
    if(G.answered) return; const v=inp.value; if(!v.trim()) return;
    const r=check(v,right,isCaps); shown=shown||right;
    say(shown.replace(/^\d+ = /,""));
    if(r==="ok") return result(true,`${rnd(["Super !","Parfait !","Bravo !","Très bien !"])} <span class="ans">${esc(shown)}</span>`);
    if(r==="umlaut") return result(true,`Almost perfect! Don't forget the accents (é è ê à ç): <span class="ans">${esc(shown)}</span>`);
    if(r==="case") return result(false,`So close — check the <b>capital letters</b>!${isCaps&&norm(v).replace(/[^.,!?]/g,"")!==norm(right).replace(/[^.,!?]/g,"")?" And "+punctTip(v,right):""} <span class="ans">${esc(shown)}</span>`);
    if(r==="punct") return result(false,`So close — ${punctTip(v,right)} <span class="ans">${esc(shown)}</span>`);
    let extra="";
    if(isDate){ extra=dateTip(v,right); }
    result(false,`Not quite. The answer is: <span class="ans">${esc(shown)}</span>${extra}${extraTip?`<div style="margin-top:6px;font-weight:700">${extraTip}</div>`:""}`);
  };
  $("#go").onclick=go;
  G.reveal=()=>{ shown=shown||right; say(shown.replace(/^\d+ = /,"")); result(false,`No problem — now you know! <span class="ans">${esc(shown)}</span>`); };
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); if(G.answered) $("#next").click(); else go(); } };
}
function dateTip(v,right){
  const n=loose(v), t=[];
  if(/\b(the|th|le)\b/.test(n)) t.push("no “le” or “th” — just: mercredi 4 novembre");
  if(/(january|february|march|april|june|july|august|september|october|november|december)\b/.test(n)||/septembre|octobre|novembre|decembre/.test(n)===false&&/ber\b/.test(n)) t.push("French months end in -bre: septembre, octobre, novembre, décembre");
  return t.length?`<div style="margin-top:6px;font-weight:700">Check: ${t.join(" · ")}</div>`:"";
}

function finish(){
  const sc=G.score, n=G.qs.length, r10=Math.round(sc/n*10), s=r10>=9?3:r10>=7?2:r10>=5?1:0;
  if(S.best[G.g]==null||r10>S.best[G.g]) S.best[G.g]=r10;
  S.rounds=(S.rounds||0)+1;
  const t=new Date().toDateString(); if(S.last!==t){ S.streak=(S.last===new Date(Date.now()-864e5).toDateString())?S.streak+1:1; S.last=t; }
  save();
  const msg=["Keep going — you'll get it!","Good start!","Très bien !","Waouh, parfait ! 🏆"][s];
  $("#app").innerHTML=`<div class="end"><div class="hero" style="justify-content:center">${MASCOT}<div class="bubble">${["Continue ! Tu vas y arriver ! 💪","Bien joué ! 👍","Très bien, Filipp ! 🎉","WAOUH ! Parfait ! 🏆"][s]}</div></div><div class="stars">${"🪙".repeat(s)}${`<span style="opacity:.25;filter:grayscale(1)">${"🪙".repeat(3-s)}</span>`}</div>
   <h1 style="margin:10px 0">${sc} / ${n}</h1><p style="font-weight:800;font-size:1.2rem">${msg}</p>
   <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn ghost" id="back">Menu</button></div></div>`;
  $("#again").onclick=()=>start(G.g); $("#back").onclick=home;
  if(s>=2){ confetti(s===3?120:50); sfxWin(); }
  if(s===3) say("Super, Filipp ! Parfait !");
}

function cards(){
  const list=G.qs; let i=0;
  const draw=()=>{
    const it=list[i];
    $("#app").innerHTML=`<div class="top"><button class="x" id="quit">✕</button><div class="bar"><i style="width:${(i+1)/list.length*100}%"></i></div><span class="pill">${i+1} / ${list.length}</span></div>
     <div class="card3d"><div class="flip" id="flip">
      <div class="face">${it.e&&it.t!=="numbers"?`<div class="emoji">${it.e}</div>`:""}<div class="big">${esc(it.de)}</div><div class="hint">tap to flip</div></div>
      <div class="face back"><div class="big">${esc(it.en)}</div><div class="hint">${esc(it.de)}</div></div></div></div>
     <div class="row" style="justify-content:center">${canSpeak?`<button class="btn ghost" id="sp">🔊 Listen</button>`:""}<button class="btn ghost" id="prev" ${i?"":"disabled"}>←</button><button class="btn" id="nx">${i<list.length-1?"Next →":"Done ✓"}</button></div>`;
    $("#quit").onclick=home; $("#flip").onclick=()=>$("#flip").classList.toggle("on");
    if($("#sp")) $("#sp").onclick=()=>say(it.de);
    $("#prev").onclick=()=>{if(i){i--;draw();}};
    $("#nx").onclick=()=>{ if(i<list.length-1){i++;draw();} else home(); };
  };
  draw();
}
home();
</script>
